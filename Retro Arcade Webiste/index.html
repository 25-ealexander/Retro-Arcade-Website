<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade OS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="xp-window">
        <div class="title-bar">
            <div class="title-text">Arcade_Explorer.exe</div>
            <div class="window-controls">
                <span>_</span><span>[]</span><span class="close-btn">X</span>
            </div>
        </div>

        <div class="content-area">
            <nav>
                <a href="index.html">Top 4 Games</a>
                <a href="games.html">Library & Media</a>
                <a href="request.html">Request Game</a>
            </nav>

            <h1>THE GOLDEN ERA<br>TOP 4 GAMES</h1>

            <p style="text-align: center; margin-bottom: 20px;">Hover over a cabinet to play (expand)</p>

            <div class="gallery-container">
                <div class="game-card"
                    style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4Y-WPZwfIb5lfV49vIzVMKLX-NBKx4-vyRQ&s');"
                    onclick="window.location.href='pacman-info.html'">
                    <h3>PAC-MAN (1980)</h3>
                </div>

                <div class="game-card"
                    style="background-image: url('https://upload.wikimedia.org/wikipedia/en/1/14/Donkey_Kong_flier.jpg');"
                    onclick="window.location.href='donkeykong-info.html'">
                    <h3>DONKEY KONG (1981)</h3>
                </div>

                <div class="game-card"
                    style="background-image: url('https://upload.wikimedia.org/wikipedia/en/6/6c/Street_Fighter_game_flyer.png');"
                    onclick="window.location.href='sf-info.html'">
                    <h3>STREET FIGHTER (1987)</h3>
                </div>

                <div class="game-card"
                    style="background-image: url('https://img-grouvee-com.b-cdn.net/upload/cache/0d/bf/0dbf9d8e753dc7f0249fdb1bad6cfe8b.jpg');"
                    onclick="window.location.href='tetris-info.html'">
                    <h3>TETRIS (1989)</h3>
                </div>
            </div>

            <br>
            <p>Welcome to the digital archive. Accessing memory banks...</p>

        </div>

        <div class="start-bar">
            <div class="start-btn">
                <div class="logo-xp"></div> start
            </div>
        </div>
    </div>

</body>

</html>
